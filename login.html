<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Login | GAME ARENA</title>
    <link rel="icon" href="assets/logos/logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Figtree:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <aside>
        <div class="shape s1"></div><a class="brand" href="index.html"><img src="assets/logos/logo.svg" alt=""
                width="40" height="40">GAME ARENA</a>
        <h1 class="in">Back in the arena.</h1><small>Sample data. No real accounts are created.</small>
    </aside>
    <main>
        <form class="fm in" action="profile.html" method="get">
            <h2>Log in</h2>
            <p>Welcome back. Pick up where you left off.</p>
            <div class="demo"><b>Demo account</b><br>Email: demo@gamearena.gg<br>Password: Arena@2026</div>
            <label class="fld">Email or username<input type="text" required pattern="demo@gamearena\.gg|ShadowKira"
                    title="Use the demo account: demo@gamearena.gg" autocomplete="username"
                    placeholder="demo@gamearena.gg"></label>
            <label class="fld">Password<input type="password" required pattern="Arena@2026"
                    title="Use the demo password: Arena@2026" autocomplete="current-password"
                    placeholder="Your password"></label>
            <div class="row"><label><input type="checkbox"> Remember me</label><a
                    href="mailto:support@gamearena.gg">Forgot password?</a></div>
            <button class="btn p" type="submit">Log in</button>
            <p class="alt">New here? <a href="register.html">Create an account</a></p>
        </form>
    </main>
</body>

</html>
