<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login | GAME Arena</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body data-root="">
    <nav id="nav"></nav>
    <main class="center card">
        <h1>Login</h1>
        <form id="lf">
            <label>Username<input name="u" required /></label><label>Password<input name="p" type="password"
                    required /></label><label><input type="checkbox" style="width: auto" /> Remember me</label>
            <p class="err" id="e"></p>
            <div class="row"><button class="btn">Login</button></div>
        </form>
        <p class="muted" style="margin-top: 1rem">
            Demo: admin / admin123 · hemanth / player123
        </p>
        <p class="muted">New here? <a href="register.html" style="color:var(--pri)">Create an account</a></p>
    </main>
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script>
        $("#lf").onsubmit = (e) => {
            e.preventDefault();
            const f = e.target,
                u = login(f.u.value.trim(), f.p.value);
            if (!u) return ($("#e").textContent = "Wrong username or password.");
            location.href =
                u.role === "admin" ? "admin/dashboard.html" : "player/dashboard.html";
        };
    </script>
</body>

</html>
