<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Create account | Game Arena</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-root="">
    <nav id="nav"></nav>
    <main class="center card">
        <h1>Create account</h1>
        <form id="rf" novalidate>
            <label>Full name<input name="name" autocomplete="name"></label>
            <label>Username<input name="username" autocomplete="username"
                    placeholder="3-20 letters, numbers or _"></label>
            <label>Email<input name="email" type="email" autocomplete="email"></label>
            <label>Password<input name="password" type="password" autocomplete="new-password"
                    placeholder="At least 6 characters"></label>
            <label>Confirm password<input name="confirm" type="password" autocomplete="new-password"></label>
            <p class="err" id="err"></p>
            <div class="row"><button class="btn">Create account</button></div>
        </form>
        <p class="muted" style="margin-top:1rem">Already have an account? <a href="login.html"
                style="color:var(--pri)">Login</a></p>
    </main>
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/register.js"></script>
</body>

</html>
