<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Admin Dashboard | GTP Arena</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body data-root="../">
    <nav id="nav"></nav>
    <main class="wrap">
        <h1>Admin Dashboard</h1>
        <div class="row"><a class="btn" href="../player/dashboard.html">Player Dashboard</a><button class="btn ghost"
                id="create">Create tournament</button></div>
        <div class="stats" id="stats" style="margin-top:1.5rem"></div>
        <h2>Tournaments &amp; live control</h2>
        <div class="tablewrap card">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Game</th>
                        <th>Date</th>
                        <th>Spots</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </div>
    </main>
    <script src="../js/data.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/admin.js"></script>
</body>

</html>
